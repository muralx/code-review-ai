# Generated by `cra init` — one deployment of code-review-ai for {{COMPANY_NAME}}.
# Re-rendered by `cra update`; edit config.yaml and .env, not this file.
services:
  reviewer:
    image: {{IMAGE}}
    container_name: cra-{{COMPANY_NAME}}
    working_dir: /deployment
    env_file: .env
    environment:
      AGENT_LINK_HUB: http://host.docker.internal:{{HUB_PORT}}
      CRA_HOST_PORTS: "{{HOST_PORTS}}"
      CRA_ALLOW_HOSTS: "{{ALLOW_HOSTS}}"
      CRA_FIREWALL: "${CRA_FIREWALL:-on}"
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_add:
      - NET_ADMIN
    volumes:
      - .:/deployment
      - claude-home:/home/reviewer
{{AGENT_LINK_VOLUME}}{{COMPANY_VOLUME}}{{LOCAL_ROOT_VOLUMES}}
    tty: true
    stdin_open: true
    restart: unless-stopped
volumes:
  claude-home:
