# code-review-ai deployment for {{COMPANY_NAME}}. Generated by `cra init`; edit freely.
company:
  repo: {{COMPANY_REPO}}
  ref: main
github:
  identity: {{IDENTITY}}            # the bot account the PAT in .env belongs to
  repos: []                          # owner/name entries to poll for review requests
  poll_interval_minutes: {{POLL_MINUTES}}
local_roots:                         # host directories mounted read-only for local: targets
{{LOCAL_ROOTS_YAML}}
agent_link:
  workspace: {{WORKSPACE}}
  name: {{AGENT_NAME}}
  notify: {{NOTIFY_PEER}}
limits:
  max_concurrent_runs: {{MAX_CONCURRENT}}
  max_specialists_per_run: 7
  max_tokens_per_run: 4000000
models:
  specialist: { model: claude-opus-5-5, effort: high }
  merger:     { model: claude-sonnet-5-5, effort: medium }
# MCP servers for the coordinator and, for the tools listed under specialist_tools, the specialists.
# cra update renders .mcp.json, enables them and opens their hosts in the firewall. Secrets go in
# .env and are referenced as ${VAR}. A host service is reached as host.docker.internal:<port>.
mcp_servers: {}
